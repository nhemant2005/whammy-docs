# Nginx server block configuration for WhammyDocs
# Our setup script will automatically replace 'YOUR_DOMAIN' with your actual DuckDNS domain.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Redirect all HTTP traffic to HTTPS (handled by Certbot, but good to have here as a fallback)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # SSL certificates will be managed and injected here by Certbot (Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' https: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https:;" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Log files
    access_log /var/log/nginx/whammy_access.log;
    error_log /var/log/nginx/whammy_error.log;

    # Increase maximum upload file size to support codebase zip uploads (up to 50MB)
    client_max_body_size 50M;

    # Serve static files (CSS, fonts, JS) directly through Nginx for maximum performance
    location /static/ {
        alias /var/www/whammy-docs/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy all other requests to the FastAPI Uvicorn service
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        
        # Standard proxy headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Disable buffering and caching for Server-Sent Events (SSE) streaming support
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Set generous timeouts for code scanning and deep AI processing
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 600s;
    }
}
