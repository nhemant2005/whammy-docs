<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhammyDocs — Generate Your Docs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center">

  <div class="w-full max-w-xl mx-auto px-4 py-12">

    <!-- Hero -->
    <div class="text-center mb-10">
      <h1 class="text-4xl font-bold text-gray-900 tracking-tight">WhammyDocs</h1>
      <p class="mt-3 text-gray-500 text-lg">Upload your project zip — get a complete docs site in seconds.</p>
    </div>

    <!-- Upload form -->
    <form
      action="/upload"
      method="post"
      enctype="multipart/form-data"
      id="upload-form"
      class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8 space-y-6"
    >

      <!-- Drag-drop zone -->
      <div
        id="drop-zone"
        class="border-2 border-dashed border-gray-300 rounded-xl p-10 text-center cursor-pointer hover:border-indigo-400 hover:bg-indigo-50 transition-colors"
        onclick="document.getElementById('file-input').click()"
      >
        <svg class="mx-auto h-12 w-12 text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
        </svg>
        <p class="text-gray-600 font-medium">Drop your <span class="text-indigo-600">.zip</span> here</p>
        <p class="text-sm text-gray-400 mt-1">or click to browse — max 50 MB</p>
        <p id="file-name" class="mt-3 text-sm font-semibold text-indigo-700 hidden"></p>
      </div>

      <input
        id="file-input"
        name="file"
        type="file"
        accept=".zip"
        class="hidden"
        onchange="showFileName(this)"
      />

      <!-- Inline error -->
      <p id="file-error" class="text-red-600 text-sm hidden"></p>

      <!-- Mode selector -->
      <fieldset class="space-y-3">
        <legend class="text-sm font-semibold text-gray-700">Generation mode</legend>

        <label class="flex items-start gap-3 p-4 rounded-xl border border-gray-200 cursor-pointer hover:border-indigo-300 hover:bg-indigo-50 transition-colors has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50">
          <input type="radio" name="mode" value="quick" class="mt-0.5 accent-indigo-600" />
          <span>
            <span class="block font-medium text-gray-900">Quick</span>
            <span class="block text-sm text-gray-500">README + API reference — ~10–20 seconds</span>
          </span>
        </label>

        <label class="flex items-start gap-3 p-4 rounded-xl border border-gray-200 cursor-pointer hover:border-indigo-300 hover:bg-indigo-50 transition-colors has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50">
          <input type="radio" name="mode" value="comprehensive" checked class="mt-0.5 accent-indigo-600" />
          <span>
            <span class="block font-medium text-gray-900">Comprehensive</span>
            <span class="block text-sm text-gray-500">README + API ref + architecture + guides — ~30–60 seconds</span>
          </span>
        </label>
      </fieldset>

      <!-- Submit -->
      <button
        type="submit"
        class="w-full py-3 px-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Generate docs
      </button>

    </form>

    <!-- Sample project link -->
    <p class="text-center mt-6 text-sm text-gray-500">
      No project handy?
      <button
        type="button"
        onclick="document.getElementById('sample-form').submit()"
        class="text-indigo-600 hover:underline font-medium"
      >Try with a sample project</button>
    </p>

    <form id="sample-form" action="/upload-sample" method="post" class="hidden"></form>

  </div>

  <script>
    function showFileName(input) {
      const nameEl = document.getElementById('file-name');
      const errorEl = document.getElementById('file-error');
      const file = input.files[0];
      if (!file) return;

      // Browser-side pre-check: type
      if (!file.name.endsWith('.zip')) {
        errorEl.textContent = 'Only .zip files are accepted.';
        errorEl.classList.remove('hidden');
        input.value = '';
        nameEl.classList.add('hidden');
        return;
      }

      // Browser-side pre-check: size (50 MB)
      if (file.size > 50 * 1024 * 1024) {
        errorEl.textContent = 'File must be under 50 MB.';
        errorEl.classList.remove('hidden');
        input.value = '';
        nameEl.classList.add('hidden');
        return;
      }

      errorEl.classList.add('hidden');
      nameEl.textContent = file.name;
      nameEl.classList.remove('hidden');
    }

    // Drag-drop wiring
    const zone = document.getElementById('drop-zone');
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('border-indigo-400', 'bg-indigo-50'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('border-indigo-400', 'bg-indigo-50'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('border-indigo-400', 'bg-indigo-50');
      const input = document.getElementById('file-input');
      input.files = e.dataTransfer.files;
      showFileName(input);
    });
  </script>

</body>
</html>
