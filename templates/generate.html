<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhammyDocs — Generating…</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .prose h1 { font-size: 1.5rem; font-weight: 700; margin: 1rem 0 0.5rem; }
    .prose h2 { font-size: 1.25rem; font-weight: 600; margin: 0.75rem 0 0.5rem; }
    .prose h3 { font-size: 1.1rem; font-weight: 600; margin: 0.5rem 0 0.25rem; }
    .prose p { margin: 0.5rem 0; line-height: 1.6; }
    .prose pre { background: #f3f4f6; border-radius: 0.375rem; padding: 0.75rem; overflow-x: auto; margin: 0.5rem 0; }
    .prose code { font-family: monospace; font-size: 0.875em; background: #f3f4f6; padding: 0.1em 0.3em; border-radius: 0.2em; }
    .prose pre code { background: none; padding: 0; }
    .prose ul, .prose ol { padding-left: 1.5rem; margin: 0.5rem 0; }
    .prose li { margin: 0.25rem 0; }
    .prose a { color: #4f46e5; text-decoration: underline; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-indigo-50/30 to-white">

  <div class="max-w-3xl mx-auto px-4 py-12">

    <!-- Header -->
    <div class="mb-8">
      <a href="/" class="text-sm text-indigo-600 hover:underline">&larr; Start over</a>
      <h1 class="mt-4 text-3xl font-bold text-gray-900">Generating your docs…</h1>
      <p id="status-text" class="mt-2 text-gray-500">Connecting to generation stream…</p>
    </div>

    <!-- Overall progress bar -->
    <div class="w-full bg-gray-200 rounded-full h-2.5 mb-8 overflow-hidden">
      <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-violet-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
    </div>

    <!-- Section cards container -->
    <div id="sections-container" class="space-y-4"></div>

    <!-- Error banner (hidden by default) -->
    <div id="error-banner" class="hidden mt-6 bg-red-50 border border-red-200 rounded-xl p-4">
      <div class="flex items-start gap-3">
        <svg class="h-5 w-5 text-red-500 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <div class="flex-1">
          <p class="text-sm font-medium text-red-800">Generation error</p>
          <p id="error-message" class="text-sm text-red-600 mt-1"></p>
        </div>
        <a href="/" class="text-sm text-red-700 font-medium hover:underline">Retry</a>
      </div>
    </div>

  </div>

  <script>
    const SESSION_ID = "{{ session_id }}";
    const MODE = "{{ mode }}";
    const KNOWN_TOTAL = MODE === "quick" ? 2 : 5;
    const SECTION_TITLES = {
      readme: "README",
      api_reference: "API Reference",
      architecture: "Architecture",
      getting_started: "Getting Started",
      deployment: "Deployment",
    };
    const ALL_SECTIONS = ["readme", "api_reference", "architecture", "getting_started", "deployment"];

    let currentSection = null;
    let sectionBuffers = {};
    let completedCount = 0;

    const container = document.getElementById("sections-container");
    const progressBar = document.getElementById("progress-bar");
    const statusText = document.getElementById("status-text");
    const errorBanner = document.getElementById("error-banner");
    const errorMessage = document.getElementById("error-message");

    function createSectionCard(key) {
      const title = SECTION_TITLES[key] || key;
      const card = document.createElement("div");
      card.id = `card-${key}`;
      // Active state: indigo border + elevated shadow
      card.className = "rounded-2xl border-2 border-indigo-300 bg-white shadow-lg p-6 transition-all duration-300";
      card.innerHTML = `
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-2.5">
            <h2 class="text-lg font-semibold text-gray-900">${title}</h2>
            <span class="relative flex h-2.5 w-2.5" id="dot-${key}">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-indigo-500"></span>
            </span>
          </div>
          <span id="badge-${key}" class="inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full bg-indigo-100 text-indigo-700">
            <svg class="h-3 w-3 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            Generating…
          </span>
        </div>
        <div id="preview-${key}" class="prose prose-sm max-w-none text-gray-700 min-h-[4rem]">
          <div class="animate-pulse space-y-2 py-1">
            <div class="h-3 bg-gray-200 rounded w-3/4"></div>
            <div class="h-3 bg-gray-200 rounded w-full"></div>
            <div class="h-3 bg-gray-200 rounded w-5/6"></div>
            <div class="h-3 bg-gray-200 rounded w-2/3"></div>
          </div>
        </div>
      `;
      container.appendChild(card);
      card.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function markSectionDone(key) {
      const card = document.getElementById(`card-${key}`);
      if (card) {
        // Done state: standard border, no ring
        card.className = "rounded-2xl border border-gray-200 bg-white shadow-sm p-6 transition-all duration-300";
      }
      const dot = document.getElementById(`dot-${key}`);
      if (dot) dot.remove();

      const badge = document.getElementById(`badge-${key}`);
      if (badge) {
        badge.innerHTML = `
          <svg class="h-3 w-3" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
          </svg>
          Done
        `;
        badge.className = "inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full bg-green-100 text-green-700";
      }
      completedCount++;
      progressBar.style.width = `${Math.round((completedCount / KNOWN_TOTAL) * 100)}%`;
    }

    const es = new EventSource("/stream/{{ session_id }}");

    es.addEventListener("section-start", (e) => {
      const key = e.data.trim();
      currentSection = key;
      sectionBuffers[key] = "";
      statusText.textContent = `Generating ${SECTION_TITLES[key] || key}… (section ${completedCount + 1} of ${KNOWN_TOTAL})`;
      createSectionCard(key);
    });

    es.addEventListener("message", (e) => {
      if (!currentSection) return;
      sectionBuffers[currentSection] += e.data;
    });

    es.addEventListener("section-complete", (e) => {
      const key = e.data.trim();
      const preview = document.getElementById(`preview-${key}`);
      if (preview && sectionBuffers[key] !== undefined) {
        preview.innerHTML = marked.parse(sectionBuffers[key]);
      }
      markSectionDone(key);
    });

    es.addEventListener("done", () => {
      es.close();
      progressBar.style.width = "100%";
      statusText.textContent = "All sections generated! Redirecting to preview…";
      setTimeout(() => {
        window.location.href = `/preview/${SESSION_ID}`;
      }, 800);
    });

    es.addEventListener("gen-error", (e) => {
      errorBanner.classList.remove("hidden");
      errorMessage.textContent = e.data;
    });

    es.onerror = () => {
      es.close();
      errorBanner.classList.remove("hidden");
      errorMessage.textContent = "Connection to generation stream lost.";
    };
  </script>

</body>
</html>
