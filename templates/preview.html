<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhammyDocs — Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .prose h1 { font-size: 1.5rem; font-weight: 700; margin: 1rem 0 0.5rem; }
    .prose h2 { font-size: 1.25rem; font-weight: 600; margin: 0.75rem 0 0.5rem; }
    .prose h3 { font-size: 1.1rem; font-weight: 600; margin: 0.5rem 0 0.25rem; }
    .prose p { margin: 0.5rem 0; line-height: 1.6; }
    .prose pre { background: #f3f4f6; border-radius: 0.375rem; padding: 0.75rem; overflow-x: auto; margin: 0.5rem 0; }
    .prose code { font-family: monospace; font-size: 0.875em; background: #f3f4f6; padding: 0.1em 0.3em; border-radius: 0.2em; }
    .prose pre code { background: none; padding: 0; }
    .prose ul, .prose ol { padding-left: 1.5rem; margin: 0.5rem 0; }
    .prose li { margin: 0.25rem 0; }
    .prose a { color: #4f46e5; text-decoration: underline; }
  </style>
</head>
<body class="min-h-screen bg-gray-50">

  <div class="max-w-4xl mx-auto px-4 py-10">

    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <a href="/" class="text-sm text-indigo-600 hover:underline">&larr; Start over</a>
        <h1 class="mt-2 text-3xl font-bold text-gray-900">Documentation Preview</h1>
        <p class="mt-1 text-gray-500">Review, edit, and download your generated docs.</p>
      </div>
      <a
        href="/download/{{ session_id }}"
        class="inline-flex items-center gap-2 px-5 py-2.5 bg-indigo-600 text-white text-sm font-semibold rounded-xl hover:bg-indigo-700 transition-colors"
      >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        Download ZIP
      </a>
    </div>

    <!-- Section cards -->
    <div class="space-y-6">
      {% for section in sections %}
      <div id="{{ section.id }}" class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">

        <!-- Card header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
          <h2 class="text-lg font-semibold text-gray-900">{{ section.title }}</h2>
          <div class="flex items-center gap-2">
            <button
              id="edit-btn-{{ section.key }}"
              onclick="startEdit('{{ section.key }}')"
              class="px-3 py-1.5 text-sm font-medium text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors"
            >Edit</button>
            <button
              id="save-btn-{{ section.key }}"
              onclick="saveEdit('{{ session_id }}', '{{ section.key }}')"
              class="hidden px-3 py-1.5 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 transition-colors"
            >Save</button>
            <button
              id="regen-btn-{{ section.key }}"
              onclick="regenSection('{{ session_id }}', '{{ section.key }}')"
              class="px-3 py-1.5 text-sm font-medium text-indigo-600 border border-indigo-300 rounded-lg hover:bg-indigo-50 transition-colors"
            >Regenerate with AI</button>
          </div>
        </div>

        <!-- Unsaved indicator (hidden by default) -->
        <div id="unsaved-{{ section.key }}" class="hidden px-6 py-2 bg-yellow-50 border-b border-yellow-100">
          <p class="text-xs text-yellow-700 font-medium">Unsaved changes</p>
        </div>

        <!-- Rendered preview -->
        <div id="rendered-{{ section.key }}" class="prose max-w-none px-6 py-4 text-gray-800 text-sm"></div>

        <!-- Editor (hidden by default) -->
        <textarea
          id="editor-{{ section.key }}"
          class="hidden w-full px-6 py-4 font-mono text-sm text-gray-800 bg-gray-50 border-t border-gray-200 resize-y focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-400"
          rows="20"
          oninput="showUnsaved('{{ section.key }}')"
        >{{ section.content }}</textarea>

      </div>
      {% endfor %}
    </div>

  </div>

  <script>
    // Render all sections on load
    {% for section in sections %}
    (function () {
      const editor = document.getElementById("editor-{{ section.key }}");
      const rendered = document.getElementById("rendered-{{ section.key }}");
      if (editor && rendered) {
        rendered.innerHTML = marked.parse(editor.value);
      }
    })();
    {% endfor %}

    function startEdit(key) {
      document.getElementById("rendered-" + key).classList.add("hidden");
      document.getElementById("editor-" + key).classList.remove("hidden");
      document.getElementById("edit-btn-" + key).classList.add("hidden");
      document.getElementById("save-btn-" + key).classList.remove("hidden");
    }

    function showUnsaved(key) {
      document.getElementById("unsaved-" + key).classList.remove("hidden");
    }

    function saveEdit(sessionId, key) {
      const content = document.getElementById("editor-" + key).value;
      fetch("/edit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, section: key, content }),
      }).then((r) => {
        if (r.ok) {
          const rendered = document.getElementById("rendered-" + key);
          rendered.innerHTML = marked.parse(content);
          rendered.classList.remove("hidden");
          document.getElementById("editor-" + key).classList.add("hidden");
          document.getElementById("edit-btn-" + key).classList.remove("hidden");
          document.getElementById("save-btn-" + key).classList.add("hidden");
          document.getElementById("unsaved-" + key).classList.add("hidden");
        }
      });
    }

    function regenSection(sessionId, key) {
      const btn = document.getElementById("regen-btn-" + key);
      btn.disabled = true;
      btn.textContent = "Regenerating…";

      const rendered = document.getElementById("rendered-" + key);
      rendered.classList.remove("hidden");
      document.getElementById("editor-" + key).classList.add("hidden");
      document.getElementById("edit-btn-" + key).classList.remove("hidden");
      document.getElementById("save-btn-" + key).classList.add("hidden");
      document.getElementById("unsaved-" + key).classList.add("hidden");

      let accumulated = "";
      const es = new EventSource(`/regenerate/${sessionId}/${key}`);
      es.addEventListener("message", (e) => {
        accumulated += e.data;
        rendered.innerHTML = marked.parse(accumulated);
        document.getElementById("editor-" + key).value = accumulated;
      });
      es.addEventListener("done", () => {
        es.close();
        btn.disabled = false;
        btn.textContent = "Regenerate with AI";
      });
      es.onerror = () => {
        es.close();
        btn.disabled = false;
        btn.textContent = "Regenerate with AI";
      };
    }
  </script>

</body>
</html>
